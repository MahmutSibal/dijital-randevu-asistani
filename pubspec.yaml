name: dijital_randevu_asistani
description: "Dijital Randevu Asistanı: hastane randevuları ve yapay zekâ asistanı."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  google_fonts: 6.3.2
  image_picker: ^1.2.4
  pdf: ^3.13.1
  printing: ^5.15.1
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

# Launcher icon and splash screen; images come from scripts/make-branding.ps1.
# Regenerate with: dart run flutter_launcher_icons && dart run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/icon.png
  adaptive_icon_background: assets/branding/icon_background.png
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  min_sdk_android: 21

flutter_native_splash:
  color: "#0E1117"
  image: assets/branding/splash.png
  android_12:
    color: "#0E1117"
    image: assets/branding/icon_foreground.png
    icon_background_color: "#4F6FF3"
